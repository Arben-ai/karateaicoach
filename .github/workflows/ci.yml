name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and generate JaCoCo report
        run: ./mvnw -B verify

      - name: Generate coverage badge
        run: |
          MISSED=$(awk -F',' 'NR>1{m+=$4} END{print m}' target/site/jacoco/jacoco.csv)
          COVERED=$(awk -F',' 'NR>1{c+=$5} END{print c}' target/site/jacoco/jacoco.csv)
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -eq 0 ]; then PCT=0; else PCT=$((COVERED * 100 / TOTAL)); fi
          if [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 75 ]; then COLOR="green"
          elif [ "$PCT" -ge 60 ]; then COLOR="yellow"
          else COLOR="red"; fi
          mkdir -p .github/badges
          curl -s "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}" -o .github/badges/jacoco.svg
          echo "Coverage: ${PCT}%"

      - name: Commit coverage badge
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'ci: update coverage badge'
          add: '.github/badges/jacoco.svg'

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30
